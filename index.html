<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HashMiner Tycoon</title>
  <!-- SDK Oficial de Telegram Mini Apps -->
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 14px; margin-bottom: 16px; }
    .user-info { font-size: 14px; font-weight: 600; color: var(--muted); }
    .rate-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .balance-box { text-align: center; margin: 10px 0 20px; }
    .balance-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-amount { font-size: 40px; font-weight: 800; color: var(--text); margin-top: 4px; }
    .balance-amount span { color: var(--gold); font-size: 24px; }
    .mine-zone { display: flex; justify-content: center; align-items: center; margin: 10px 0 24px; }
    .mine-btn {
      width: 170px; height: 170px; border-radius: 50%; border: 4px solid var(--accent);
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      box-shadow: 0 0 30px var(--accent-glow);
      color: var(--text); font-size: 18px; font-weight: 800; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: transform 0.08s ease;
    }
    .mine-btn:active { transform: scale(0.93); }
    .mine-icon { font-size: 46px; margin-bottom: 6px; }
    .ad-btn {
      background: linear-gradient(90deg, #f59e0b, #d97706); border: none; color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px;
      margin-bottom: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .upgrades-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .upgrade-list { display: flex; flex-direction: column; gap: 10px; }
    .upgrade-card {
      background: var(--card); padding: 14px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .up-info h4 { font-size: 15px; margin-bottom: 3px; }
    .up-info p { font-size: 12px; color: var(--muted); }
    .buy-btn {
      background: var(--accent); color: #052e16; border: none; padding: 10px 14px;
      border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; min-width: 90px;
    }
    .buy-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info" id="username">Minero Invitado</div>
    <div class="rate-badge">+<span id="pps">0</span> HASH/s</div>
  </div>

  <div class="balance-box">
    <div class="balance-label">Balance Minado</div>
    <div class="balance-amount"><span id="balance">0</span> <span>HASH</span></div>
  </div>

  <div class="mine-zone">
    <button class="mine-btn" id="mineBtn">
      <div class="mine-icon">⛏️</div>
      <div>MINAR (+<span id="clickPower">1</span>)</div>
    </button>
  </div>

  <!-- Espacio listo para monetizar con anuncios (Adsgram / Monetag) -->
  <button class="ad-btn" id="boostBtn">
    ⚡ Ver Anuncio: +500 HASH Gratis
  </button>

  <div class="upgrades-title">EQUIPO DE MINERÍA</div>
  <div class="upgrade-list" id="upgradeList"></div>

  <script>
    // Inicializar Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
    }

    // Estado del juego (cargado desde memoria local)
    let state = JSON.parse(localStorage.getItem('hashMinerState')) || {
      balance: 0,
      clickPower: 1,
      pps: 0,
      upgrades: [
        { id: 'cpu', name: 'Procesador Básico', desc: '+1 HASH por clic', cost: 25, type: 'click', power: 1, level: 0 },
        { id: 'gpu', name: 'Tarjeta Gráfica GTX', desc: '+2 HASH por segundo', cost: 100, type: 'auto', power: 2, level: 0 },
        { id: 'rig', name: 'Rig de Minería 6x', desc: '+12 HASH por segundo', cost: 500, type: 'auto', power: 12, level: 0 },
        { id: 'asic', name: 'Antminer S21 Pro', desc: '+65 HASH por segundo', cost: 2500, type: 'auto', power: 65, level: 0 }
      ]
    };

    function saveState() {
      localStorage.setItem('hashMinerState', JSON.stringify(state));
    }

    function updateUI() {
      document.getElementById('balance').innerText = Math.floor(state.balance).toLocaleString();
      document.getElementById('pps').innerText = state.pps.toLocaleString();
      document.getElementById('clickPower').innerText = state.clickPower;

      const list = document.getElementById('upgradeList');
      list.innerHTML = '';
      state.upgrades.forEach((up, index) => {
        const canAfford = state.balance >= up.cost;
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div class="up-info">
            <h4>${up.name} (Nv. ${up.level})</h4>
            <p>${up.desc}</p>
          </div>
          <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buyUpgrade(${index})">
            ${up.cost.toLocaleString()} HASH
          </button>
        `;
        list.appendChild(card);
      });
    }

    // Clic manual para minar
    document.getElementById('mineBtn').addEventListener('click', () => {
      state.balance += state.clickPower;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      saveState();
      updateUI();
    });

    // Comprar mejoras
    window.buyUpgrade = function(index) {
      const up = state.upgrades[index];
      if (state.balance >= up.cost) {
        state.balance -= up.cost;
        up.level += 1;
        up.cost = Math.floor(up.cost * 1.45);
        if (up.type === 'click') state.clickPower += up.power;
        if (up.type === 'auto') state.pps += up.power;
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        saveState();
        updateUI();
      }
    };

    // Botón de recompensa (aquí irá el SDK de Adsgram/Monetag)
    document.getElementById('boostBtn').addEventListener('click', () => {
      state.balance += 500;
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      tg.showAlert('¡Recibiste +500 HASH! (Aquí conectaremos tu anuncio real)');
      saveState();
      updateUI();
    });

    // Minado pasivo cada segundo
    setInterval(() => {
      if (state.pps > 0) {
        state.balance += state.pps;
        saveState();
        updateUI();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
