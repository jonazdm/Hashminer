<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HashMiner Tycoon</title>
  <script>
    const tgScript = document.createElement('script');
    tgScript.src = 'https://' + 'telegram.org' + '/js/telegram-web-app.js';
    document.head.appendChild(tgScript);
  </script>
  <script>
    const adScript = document.createElement('script');
    adScript.src = 'https://' + 'sad.adsgram.ai' + '/js/sad.min.js';
    document.head.appendChild(adScript);
  </script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4); --gold: #f59e0b;
      --purple: #8b5cf6; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; padding: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; }
    .user-box { display: flex; flex-direction: column; }
    .user-info { font-size: 13px; font-weight: 700; color: var(--text); }
    .rank-badge { font-size: 11px; color: var(--gold); font-weight: 600; }
    .rate-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

    .rank-progress-wrap { background: var(--card); height: 6px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .rank-progress-bar { background: linear-gradient(90deg, var(--accent), var(--gold)); height: 100%; width: 0%; transition: width 0.3s; }

    .tags-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
    .tag-chip {
      background: var(--card); border: 1px solid #334155; color: var(--muted);
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .tag-chip.active { background: rgba(139, 92, 246, 0.2); border-color: var(--purple); color: #ddd6fe; }

    .balance-box { text-align: center; margin: 2px 0 12px; }
    .balance-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-amount { font-size: 34px; font-weight: 800; color: var(--text); margin-top: 2px; }
    .balance-amount span { color: var(--gold); font-size: 19px; }

    .mine-zone { display: flex; justify-content: center; align-items: center; margin: 2px 0 14px; }
    .mine-btn {
      width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--accent);
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      box-shadow: 0 0 26px var(--accent-glow);
      color: var(--text); font-size: 15px; font-weight: 800; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: transform 0.08s ease;
    }
    .mine-btn:active { transform: scale(0.93); }
    .mine-icon { font-size: 38px; margin-bottom: 4px; }

    .action-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .ad-btn, .box-btn {
      flex: 1; border: none; color: #fff; padding: 11px 8px; border-radius: 12px;
      font-weight: 700; font-size: 12px; cursor: pointer; text-align: center;
    }
    .ad-btn { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .box-btn { background: linear-gradient(90deg, #8b5cf6, #6d28d9); }

    .section-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; margin: 10px 0 8px; text-transform: uppercase; }
    .list-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .card-item {
      background: var(--card); padding: 12px 14px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .up-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #334155; color: #cbd5e1; margin-bottom: 3px; }
    .item-info h4 { font-size: 14px; margin-bottom: 2px; }
    .item-info p { font-size: 11px; color: var(--muted); }
    .action-pill {
      background: var(--accent); color: #052e16; border: none; padding: 9px 12px;
      border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; min-width: 90px; text-align: center;
    }
    .action-pill:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .action-pill.claimed { background: #1e293b; border: 1px solid #334155; color: #64748b; }

    /* Modal Offline */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88);
      display: none; justify-content: center; align-items: center; padding: 20px; z-index: 99;
    }
    .modal-card {
      background: var(--card); border: 1px solid #334155; border-radius: 18px;
      padding: 20px; width: 100%; max-width: 340px; text-align: center;
    }
    .modal-card h3 { font-size: 18px; margin-bottom: 6px; color: var(--gold); }
    .modal-card p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .modal-earned { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 16px; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-box">
      <div class="user-info" id="username">Minero Pro</div>
      <div class="rank-badge" id="rankName">⛏️ Rango: Novato</div>
    </div>
    <div class="rate-badge">+<span id="pps">0</span> HASH/s</div>
  </div>
  <div class="rank-progress-wrap"><div class="rank-progress-bar" id="rankBar"></div></div>

  <div class="tags-bar" id="tagsBar">
    <div class="tag-chip active" data-filter="all">#Todos</div>
    <div class="tag-chip" data-filter="click">#Manual</div>
    <div class="tag-chip" data-filter="auto">#Pasivo</div>
    <div class="tag-chip" data-filter="ad">#Ads</div>
    <div class="tag-chip" data-filter="quests">#Misiones</div>
  </div>

  <div class="balance-box">
    <div class="balance-label">Balance Minado</div>
    <div class="balance-amount"><span id="balance">0</span> <span>HASH</span></div>
  </div>

  <div class="mine-zone">
    <button class="mine-btn" id="mineBtn">
      <div class="mine-icon">⛏️</div>
      <div>MINAR (+<span id="clickPower">1</span>)</div>
    </button>
  </div>

  <div class="action-row">
    <button class="ad-btn" id="boostBtn">⚡ Ver Anuncio (+500)</button>
    <button class="box-btn" id="mysteryBtn">🎁 Cofre Ad (x2 Clic 30s)</button>
  </div>

  <div id="questsSection" style="display:none;">
    <div class="section-title">MISIONES DIARIAS</div>
    <div class="list-box" id="questList"></div>
  </div>

  <div id="upgradesSection">
    <div class="section-title">EQUIPO DE MINERÍA</div>
    <div class="list-box" id="upgradeList"></div>
  </div>

  <!-- Ventana emergente de Ganancias Offline -->
  <div class="modal-overlay" id="offlineModal">
    <div class="modal-card">
      <h3>🌙 Minería Offline</h3>
      <p>Tus equipos siguieron trabajando mientras no estabas:</p>
      <div class="modal-earned">+<span id="offlineAmount">0</span> HASH</div>
      <div class="modal-btns">
        <button class="ad-btn" id="claimOfflineDoubleBtn">⚡ Reclamar x2 (Ver Anuncio)</button>
        <button class="action-pill" id="claimOfflineNormalBtn">Reclamar Normal</button>
      </div>
    </div>
  </div>
<!-- FIN PARTE 1 -->
  <script>
    const BLOCK_ID = "59731";
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('username').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
      }
    }

    function notifyUser(msg) {
      if (tg && tg.showAlert) tg.showAlert(msg);
      else alert(msg);
    }

    function showAdsgramReward(onSuccess) {
      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: BLOCK_ID });
        AdController.show().then(() => {
          onSuccess();
        }).catch(() => {
          notifyUser('Anuncio no completado o en revisión de Adsgram.');
        });
      } else {
        notifyUser('Cargando red de anuncios, intenta en unos segundos.');
      }
    }

    const ranks = [
      { name: '⛏️ Novato', min: 0 },
      { name: '⚙️ Aprendiz', min: 1000 },
      { name: '🖥️ Operador', min: 10000 },
      { name: '🏭 Magnate', min: 50000 },
      { name: '🐋 Ballena Cripto', min: 250000 }
    ];

    const defaultUpgrades = [
      { id: 'cpu', tag: 'click', tagName: '#Manual', name: 'Procesador Básico', desc: '+1 HASH por clic', cost: 25, type: 'click', power: 1, level: 0 },
      { id: 'gpu', tag: 'auto', tagName: '#Pasivo', name: 'Tarjeta Gráfica GTX', desc: '+2 HASH por segundo', cost: 100, type: 'auto', power: 2, level: 0 },
      { id: 'adboost', tag: 'ad', tagName: '#Ads', name: 'Antena Patrocinada', desc: '+250 HASH extra por anuncio', cost: 250, type: 'adBonus', power: 250, level: 0 },
      { id: 'rig', tag: 'auto', tagName: '#Pasivo', name: 'Rig de Minería 6x', desc: '+12 HASH por segundo', cost: 500, type: 'auto', power: 12, level: 0 },
      { id: 'asic', tag: 'auto', tagName: '#Pasivo', name: 'Antminer S21 Pro', desc: '+65 HASH por segundo', cost: 2500, type: 'auto', power: 65, level: 0 }
    ];

    const todayStr = new Date().toDateString();
    let saved = JSON.parse(localStorage.getItem('hashMinerV6'));
    let state = (saved && Array.isArray(saved.upgrades)) ? saved : {
      balance: 0, totalMined: 0, clickPower: 1, pps: 0, adBonus: 0,
      lastSeen: Date.now(),
      dailyDate: todayStr,
      daily: { clicks: 0, upgrades: 0, ads: 0, claimed: {} },
      upgrades: defaultUpgrades
    };

    if (state.dailyDate !== todayStr) {
      state.dailyDate = todayStr;
      state.daily = { clicks: 0, upgrades: 0, ads: 0, claimed: {} };
    }

    let currentFilter = 'all';
    let clickMultiplier = 1;
    let offlineEarnings = 0;

    // Calcular minería offline (máximo 4 horas acumuladas)
    const now = Date.now();
    const elapsedSec = Math.floor((now - (state.lastSeen || now)) / 1000);
    if (elapsedSec > 30 && state.pps > 0) {
      const cappedSec = Math.min(elapsedSec, 14400);
      offlineEarnings = cappedSec * state.pps;
      document.getElementById('offlineAmount').innerText = offlineEarnings.toLocaleString();
      document.getElementById('offlineModal').style.display = 'flex';
    }

    function saveState() {
      state.lastSeen = Date.now();
      localStorage.setItem('hashMinerV6', JSON.stringify(state));
    }

    function updateRank() {
      let currentRank = ranks[0];
      let nextRank = ranks[1];
      for (let i = 0; i < ranks.length; i++) {
        if ((state.totalMined || state.balance) >= ranks[i].min) {
          currentRank = ranks[i];
          nextRank = ranks[i + 1] || null;
        }
      }
      document.getElementById('rankName').innerText = `Rango: ${currentRank.name}`;
      if (nextRank) {
        const progress = Math.min(100, (((state.totalMined || state.balance) - currentRank.min) / (nextRank.min - currentRank.min)) * 100);
        document.getElementById('rankBar').style.width = progress + '%';
      } else {
        document.getElementById('rankBar').style.width = '100%';
      }
    }

    function renderQuests() {
      const quests = [
        { id: 'q_clicks', title: 'Minero Activo', desc: `Haz 50 clics hoy (${Math.min(state.daily.clicks, 50)}/50)`, done: state.daily.clicks >= 50, reward: 300 },
        { id: 'q_up', title: 'Inversionista', desc: `Compra 1 mejora hoy (${Math.min(state.daily.upgrades, 1)}/1)`, done: state.daily.upgrades >= 1, reward: 400 },
        { id: 'q_ad', title: 'Patrocinador', desc: `Mira 1 anuncio hoy (${Math.min(state.daily.ads, 1)}/1)`, done: state.daily.ads >= 1, reward: 600 }
      ];
      const qList = document.getElementById('questList');
      qList.innerHTML = '';
      quests.forEach(q => {
        const isClaimed = !!state.daily.claimed[q.id];
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="item-info">
            <h4>${q.title} (+${q.reward} HASH)</h4>
            <p>${q.desc}</p>
          </div>
          <button class="action-pill ${isClaimed ? 'claimed' : ''}" ${(!q.done || isClaimed) ? 'disabled' : ''} onclick="claimQuest('${q.id}', ${q.reward})">
            ${isClaimed ? 'Listo' : (q.done ? 'Reclamar' : 'Pendiente')}
          </button>
        `;
        qList.appendChild(card);
      });
    }

    window.claimQuest = function(id, reward) {
      if (state.daily.claimed[id]) return;
      state.daily.claimed[id] = true;
      state.balance += reward;
      state.totalMined = (state.totalMined || 0) + reward;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      saveState();
      updateUI();
    };

    function updateUI() {
      const effectiveClick = state.clickPower * clickMultiplier;
      document.getElementById('balance').innerText = Math.floor(state.balance).toLocaleString();
      document.getElementById('pps').innerText = state.pps.toLocaleString();
      document.getElementById('clickPower').innerText = effectiveClick;
      document.getElementById('boostBtn').innerText = `⚡ Ver Anuncio (+${500 + (state.adBonus || 0)})`;
      updateRank();

      if (currentFilter === 'quests') {
        document.getElementById('questsSection').style.display = 'block';
        document.getElementById('upgradesSection').style.display = 'none';
        renderQuests();
        return;
      }

      document.getElementById('questsSection').style.display = 'none';
      document.getElementById('upgradesSection').style.display = 'block';

      const list = document.getElementById('upgradeList');
      list.innerHTML = '';
      state.upgrades.forEach((up, index) => {
        if (currentFilter !== 'all' && up.tag !== currentFilter) return;
        const canAfford = state.balance >= up.cost;
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="item-info">
            <span class="up-tag">${up.tagName}</span>
            <h4>${up.name} (Nv. ${up.level})</h4>
            <p>${up.desc}</p>
          </div>
          <button class="action-pill" ${canAfford ? '' : 'disabled'} onclick="buyUpgrade(${index})">
            ${up.cost.toLocaleString()}
          </button>
        `;
        list.appendChild(card);
      });
    }

    document.querySelectorAll('.tag-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.getAttribute('data-filter');
        updateUI();
      });
    });

    document.getElementById('mineBtn').addEventListener('click', () => {
      const gain = state.clickPower * clickMultiplier;
      state.balance += gain;
      state.totalMined = (state.totalMined || 0) + gain;
      state.daily.clicks += 1;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      saveState();
      updateUI();
    });

    window.buyUpgrade = function(index) {
      const up = state.upgrades[index];
      if (state.balance >= up.cost) {
        state.balance -= up.cost;
        up.level += 1;
        up.cost = Math.floor(up.cost * 1.45);
        state.daily.upgrades += 1;
        if (up.type === 'click') state.clickPower += up.power;
        if (up.type === 'auto') state.pps += up.power;
        if (up.type === 'adBonus') state.adBonus = (state.adBonus || 0) + up.power;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        saveState();
        updateUI();
      }
    };

    document.getElementById('boostBtn').addEventListener('click', () => {
      showAdsgramReward(() => {
        const reward = 500 + (state.adBonus || 0);
        state.balance += reward;
        state.totalMined = (state.totalMined || 0) + reward;
        state.daily.ads += 1;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        notifyUser(`¡Recibiste +${reward} HASH!`);
        saveState();
        updateUI();
      });
    });

    document.getElementById('mysteryBtn').addEventListener('click', () => {
      if (clickMultiplier > 1) {
        notifyUser('¡Ya tienes el multiplicador x2 activo!');
        return;
      }
      showAdsgramReward(() => {
        clickMultiplier = 2;
        state.daily.ads += 1;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        notifyUser('¡Turbo x2 activado por 30 segundos!');
        updateUI();
        setTimeout(() => { clickMultiplier = 1; updateUI(); }, 30000);
      });
    });

    document.getElementById('claimOfflineNormalBtn').addEventListener('click', () => {
      state.balance += offlineEarnings;
      state.totalMined = (state.totalMined || 0) + offlineEarnings;
      document.getElementById('offlineModal').style.display = 'none';
      saveState();
      updateUI();
    });

    document.getElementById('claimOfflineDoubleBtn').addEventListener('click', () => {
      showAdsgramReward(() => {
        const doubled = offlineEarnings * 2;
        state.balance += doubled;
        state.totalMined = (state.totalMined || 0) + doubled;
        state.daily.ads += 1;
        document.getElementById('offlineModal').style.display = 'none';
        notifyUser(`¡Reclamaste +${doubled.toLocaleString()} HASH!`);
        saveState();
        updateUI();
      });
    });

    setInterval(() => {
      if (state.pps > 0) {
        state.balance += state.pps;
        state.totalMined = (state.totalMined || 0) + state.pps;
        saveState();
        updateUI();
      }
    }, 1000);

    updateUI();
  </script>
</body>
</html>
